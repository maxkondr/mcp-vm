global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: victoria-metrics
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:8428

  - job_name: mcp-server
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8080
