services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-vm-server:local
    environment:
      VM_ADDRESS: ${VM_ADDRESS:-http://host.docker.internal:8428}
      MCP_HTTP_ADDR: ${MCP_HTTP_ADDR:-:8080}
      MCP_API_KEY: ${MCP_API_KEY:-local-dev-mcp-key}
    ports:
      - "8080:8080"
    restart: "no"
